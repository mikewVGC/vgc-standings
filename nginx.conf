worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map_hash_bucket_size 32768;

    server {
        listen 80;
        server_name localhost;
        ssi on;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        # these are for the main pages

        location ~ "^/([0-9]{4}|grassroots)$" {
            set $season $1;
            rewrite "^/([0-9]{4}|grassroots)$" /static/season.html last;
        }

        location ~ "(*UTF8)^/([0-9]{4}|grassroots)/([0-9a-z-]+)(?:/([0-9a-z-]+))?(?:/(.*))?$" {
            set $season $1;
            set $tournament "event/$2";
            set $section $3;
            set $lookup "$3/$4";
            rewrite "(*UTF8)^/([0-9]{4}|grassroots)/([0-9a-z-]+)(?:/([0-9a-z-]+))?(?:/(.*))?$" /static/tournament.html last;
        }

        location ~ "^/(terms|privacy)$" {
            rewrite "^/(terms|privacy)$" /static/$1.html last;
        }

        # these are for the "API" which are just static json files

        location ~ "^/api/v1/([0-9]{4}|grassroots)$" {
            rewrite "^/api/v1/([0-9]{4}|grassroots)$" /data/$1.json last;
        }

        location ~ "^/api/v1/[0-9]{4}/updates$" {
            rewrite "^/api/v1/([0-9]{4})/updates$" /data/$1/updates.json last;
        }

        location ~ "^/api/v1/([0-9]{4}|grassroots)/[0-9a-z-]+$" {
            rewrite "^/api/v1/([0-9]{4}|grassroots)/([0-9a-z-]+)$" /data/$1/$2.json last;
        }

        location ~ "^/api/v1/([0-9]{4}|grassroots)/[0-9a-z-]+/usage$" {
            rewrite "^/api/v1/([0-9]{4}|grassroots)/([0-9a-z-]+)/usage$" /data/$1/$2-usage.json last;
        }
    }

    map $season $season_name {
        default "$season Season";
        "grassroots" "VGC Grassroots Events";
    }

    map $tournament $tour_name {
        default "";
        include /etc/nginx/slugs.map;
    }

    map $section $description_info {
        default "";
        include /etc/nginx/slugs.map;
    }

    map $section $is_usage {
        default "false";
        "usage" "true";
    }

    map $section $is_pairings {
        default "false";
        "pairings" "true";
    }

    map $lookup $readable_name {
        default "";
        include /etc/nginx/slugs.map;
    }
}
